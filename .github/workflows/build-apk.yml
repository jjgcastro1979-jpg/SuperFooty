: Construir APK SuperFooty Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'config.xml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Preparar proyecto Android
        run: |
          mkdir superfooty-build
          cp config.xml superfooty-build/config.xml
          cp -r www superfooty-build/www

      - name: Añadir plataforma Android
        working-directory: superfooty-build
        run: cordova platform add android@13

      - name: Construir APK
        working-directory: superfooty-build
        run: cordova build android --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperFooty-Pro-APK
          path: superfooty-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
