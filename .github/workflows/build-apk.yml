name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'config.xml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Añadir Android
        run: cordova platform add android@13

      - name: Construir APK
        run: cordova build android --debug

      - name: Comprobar APK generada
        run: |
          echo "Buscando archivos APK..."
          find platforms/android -type f -name "*.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperFooty-Pro-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
