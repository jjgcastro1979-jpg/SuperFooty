name: Compilar APK Limpia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar Cordova Globalmente
      run: npm install -g cordova

    - name: Crear Plataforma Android
      run: cordova platform add android --nobuild

    - name: Compilar APK de Depuración (Debug)
      run: cordova build android

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: SuperFooty-APK
        path: platforms/android/app/build/outputs/apk/debug/*.apk
