name: Compilar APK Deportiva

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar Cordova Globalmente
      run: npm install -g cordova

    - name: Forzar Versión de Gradle Compatible (Solución Real)
      run: |
        sudo wget -q https://gradle.org -O /opt/gradle-8.7-bin.zip
        sudo unzip -q /opt/gradle-8.7-bin.zip -d /opt/gradle
        echo "GRADLE_HOME=/opt/gradle/gradle-8.7" >> $GITHUB_ENV
        echo "PATH=/opt/gradle/gradle-8.7/bin:$PATH" >> $GITHUB_ENV

    - name: Configurar Proyecto e Instalar Plugins
      run: |
        cordova platform add android --nobuild
        cordova plugin add cordova-plugin-whitelist || true

    - name: Compilar APK de Depuración (Debug)
      run: |
        export PATH=/opt/gradle/gradle-8.7/bin:$PATH
        cordova build android --debug

    - name: Guardar APK como Archivo Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App-Apuestas-Deportivas
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
