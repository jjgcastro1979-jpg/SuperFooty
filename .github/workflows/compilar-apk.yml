name: Compilar APK Deportiva

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar Cordova
      run: npm install -g cordova

    - name: Crear Configuración Base de Cordova
      run: |
        echo '<?xml version="1.0" encoding="UTF-8"?><widget></widget>' > config.xml

    - name: Crear Plataforma Android
      run: |
        cordova platform add android --nobuild
        
    - name: Compilar APK de Depuración (Debug)
      run: cordova build android --debug

    - name: Guardar APK como Archivo Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App-Apuestas-Deportivas
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
