<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: https://ssl.gstatic.com; connect-src *;">
    <title>SuperFooty | Análisis IA</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); padding-bottom: 70px; }
        
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
        .logo span { color: var(--accent); }
        
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 100; border-top: 1px solid #e2e8f0; }
        nav a { color: var(--gray); text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        nav a.active { color: var(--primary); }
        
        .page { display: none; padding: 20px; max-width: 800px; margin: 0 auto; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: var(--dark); border-left: 5px solid var(--accent); padding-left: 10px;}
        
        .match-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; transition: transform 0.2s; }
        .match-card:active { transform: scale(0.98); }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .league-badge { background: #e0e7ff; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .match-time { color: var(--gray); font-size: 13px; font-weight: bold; }
        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team-name { font-size: 16px; font-weight: bold; width: 40%; }
        .team-name.right { text-align: right; }
        .vs-badge { background: var(--dark); color: white; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; width: 100%; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .btn:active { background: #059669; }
        
        .loader { text-align: center; font-weight: bold; color: var(--primary); padding: 30px; }
        
        select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; background: white; font-size: 15px; font-weight: bold; color: var(--dark); }

        .duel-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .duel-stats { display: flex; flex-direction: column; width: 100%; gap: 5px; }
        .duel-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--dark); margin-bottom: 5px; }
        .duel-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; display: flex; overflow: hidden; }
        .duel-bar-left { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 5px 0 0 5px; transition: width 1s ease-out; }
        .duel-bar-right { height: 100%; background: linear-gradient(90deg, #f87171, #ef4444); border-radius: 0 5px 5px 0; transition: width 1s ease-out; }
        .duel-bar-left.mid { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .duel-bar-right.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    </style>
</head>
<body>
    <header>
        <div class="logo">⚽ SUPER<span>FOOTY</span></div>
    </header>

    <main id="inicio" class="page active">
        <div style="background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 20px;">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Bienvenido a SuperFooty</h1>
            <p style="font-size: 14px; opacity: 0.9; margin-bottom: 20px;">Partidos en vivo y análisis con IA.</p>
            <button class="btn" onclick="showPage('partidos')" style="background:white; color:var(--primary); box-shadow:none;">Ver Partidos de Hoy</button>
        </div>
    </main>

    <main id="partidos" class="page">
        <h2>Partidos de Hoy</h2>
        
        <select id="league-select">
            <option value="esp.1">La Liga (España)</option>
            <option value="eng.1">Premier League (Inglaterra)</option>
            <option value="ita.1">Serie A (Italia)</option>
            <option value="ger.1">Bundesliga (Alemania)</option>
            <option value="fra.1">Ligue 1 (Francia)</option>
        </select>

        <div id="lista-partidos">
            <div class="loader">Pulsa Generar para ver los partidos de hoy...</div>
        </div>
        
        <br>
        <button class="btn" onclick="cargarPartidos()">🔄 Generar Partidos</button>
    </main>

    <main id="equipos" class="page">
        <h2>Equipos</h2>
        <div class="match-card">
            <h3>🛡️ Base de Datos</h3>
            <p style="font-size:13px; color:#64748b; margin-top:5px;">Próximamente podrás buscar cualquier equipo del mundo.</p>
        </div>
    </main>

    <nav>
        <a id="nav-inicio" class="active" onclick="showPage('inicio')">🏠 <span>Inicio</span></a>
        <a id="nav-partidos" onclick="showPage('partidos')">⚽ <span>Partidos IA</span></a>
        <a id="nav-equipos" onclick="showPage('equipos')">🛡️ <span>Equipos</span></a>
    </nav>

    <script src="cordova.js"></script>
    <script src="app.js"></script>
    
    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(nav => nav.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
        }
    </script>
</body>
</html>
