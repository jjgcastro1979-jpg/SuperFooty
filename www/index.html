<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Insights Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        .header { background-color: #222; color: white; padding: 15px; text-align: center; position: relative; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 500; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #aaa; }
        .back-btn { position: absolute; left: 15px; top: 20px; color: white; text-decoration: none; font-size: 20px; cursor: pointer; }
        
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; overflow-x: auto; }
        .tab { flex: 1; text-align: center; padding: 15px 10px; font-weight: 500; color: #666; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .tab.active { color: #333; border-bottom: 3px solid #333; font-weight: 700; }

        .container { max-width: 600px; margin: 0 auto; padding-bottom: 30px; }
        .section-title { background: #e9ecef; padding: 10px 15px; font-weight: 700; font-size: 14px; margin-top: 10px; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; color: #555; display: flex; align-items: center;}
        .section-title span { margin-right: 8px; }
        .card { background: #fff; padding: 15px; margin-bottom: 10px; border-bottom: 1px solid #eee; }
        
        .teams-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team { text-align: center; width: 30%; }
        .team img { width: 50px; height: 50px; object-fit: contain; }
        .team h3 { font-size: 12px; margin: 5px 0; }
        
        .bar-container { display: flex; align-items: center; margin-bottom: 15px; font-size: 13px; }
        .bar-left { width: 40%; text-align: right; padding-right: 10px; font-weight: bold; }
        .bar-right { width: 40%; padding-left: 10px; font-weight: bold; }
        .bar-middle { width: 20%; height: 8px; background: #eee; display: flex; border-radius: 4px; overflow: hidden; }
        .bar-fill-green { background: #4CAF50; height: 100%; }
        .bar-fill-red { background: #F44336; height: 100%; }

        .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .stats-table th, .stats-table td { padding: 10px; text-align: center; border: 1px solid #eee; }
        .stats-table th { background: #f8f9fa; font-weight: 500; color: #666; }
        .stats-table td:first-child { text-align: left; font-weight: 500; }
        
        .bg-green { background-color: #d4edda; color: #155724; }
        .bg-yellow { background-color: #fff3cd; color: #856404; }
        .bg-red { background-color: #f8d7da; color: #721c24; }

        .pick-box { background: #222; color: white; padding: 15px; border-radius: 8px; margin: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .pick-box h2 { margin: 0 0 10px 0; color: #4CAF50; font-size: 18px; }
        .pick-box p { margin: 0; font-size: 14px; line-height: 1.4; }

        #main-screen { display: block; padding: 15px; }
        #detail-screen { display: none; }
        button.search-btn { width: 100%; padding: 15px; background: #222; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .loader { text-align: center; font-weight: bold; padding: 20px; color: #666; }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="header"><h1>UEFA Insights</h1></div>
        <div class="container">
            <select id="league-select" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <option value="2">UEFA Champions League</option>
                <option value="3">UEFA Europa League</option>
                <option value="848">UEFA Conference League</option>
            </select>
            <input type="date" id="date-select" style="width: 100%; padding: 10px; box-sizing: border-box;">
            <button id="fetch-btn" class="search-btn">Buscar Partidos Europeos</button>
            <div id="results-list" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="detail-screen">
        <div class="header">
            <span class="back-btn" onclick="volverAtras()">←</span>
            <h1 id="detail-match-title">Cargando...</h1>
            <p id="detail-league-title">Competición</p>
        </div>
        
        <div class="tabs">
            <div class="tab active">Análisis IA</div>
            <div class="tab">Goles</div>
            <div class="tab">Córners</div>
            <div class="tab">Tarjetas</div>
        </div>

        <div class="container" id="detail-content">
            <!-- El análisis se cargará aquí -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
