<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Insights</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; background-color: #050b14; color: #ffffff; }
        
        /* BARRA SUPERIOR VERDE */
        .top-bar { background-color: #ccff00; color: #000; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; border-radius: 0 0 15px 15px; position: sticky; top: 0; z-index: 100; }
        
        /* PANTALLA PRINCIPAL */
        #main-screen { padding: 20px; }
        select, input[type="date"] { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f1c3f; color: white; border: 1px solid #1d3060; border-radius: 8px; font-family: 'Montserrat'; font-size: 14px; }
        .btn-search { width: 100%; padding: 15px; background: #ccff00; color: #000; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; }
        
        /* LISTA DE PARTIDOS */
        .match-item { background: #0f1c3f; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 4px solid #ccff00; }
        .match-item:active { background: #162a5a; }

        /* PANTALLA DE DETALLE (TUS FOTOS) */
        #detail-screen { display: none; padding-bottom: 30px; }
        
        .detail-header { background: #0b1736; padding: 20px; border-radius: 0 0 20px 20px; position: relative; }
        .back-icon { font-size: 20px; cursor: pointer; margin-bottom: 15px; display: inline-block; }
        
        .match-title { font-size: 24px; font-weight: 800; line-height: 1.2; margin-bottom: 15px; }
        .match-title span { color: #ccff00; }
        
        .info-row { display: flex; align-items: center; font-size: 13px; color: #a8b2d1; margin-bottom: 10px; }
        .info-row svg { margin-right: 8px; fill: #a8b2d1; width: 16px; height: 16px; }

        /* BARRAS DE ESTADÍSTICAS */
        .stats-card { background: #0f1c3f; border-radius: 15px; padding: 15px; margin: 15px 20px; }
        .stat-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 12px; color: #a8b2d1; }
        .stat-name { width: 30%; }
        .stat-bar-bg { width: 60%; height: 8px; background: #1d3060; border-radius: 4px; margin: 0 10px; overflow: hidden; display: flex;}
        .stat-bar-fill { height: 100%; background: #ccff00; border-radius: 4px; }
        .stat-value { width: 10%; text-align: right; color: white; font-weight: bold; }

        /* PICK IA */
        .ai-pick { background: #14264f; border: 1px solid #ccff00; border-radius: 15px; padding: 15px; margin: 15px 20px; }
        .ai-pick h3 { margin: 0 0 10px 0; color: #ccff00; font-size: 16px; display: flex; align-items: center;}
        .ai-pick p { margin: 0; font-size: 14px; line-height: 1.4; }

        /* TARJETAS DE ESTADÍSTICAS (AEM, Goles, etc) */
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 20px; }
        .grid-card { background: #0f1c3f; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 3px solid #ccff00; }
        .grid-card h4 { margin: 0 0 5px 0; font-size: 12px; color: #a8b2d1; }
        .grid-card .value { font-size: 18px; font-weight: 800; color: #ccff00; }

        /* BOTÓN FLOTANTE */
        .floating-btn { background: #ccff00; color: #000; border: none; width: 90%; margin: 20px 5%; padding: 15px; border-radius: 30px; font-weight: 800; font-size: 16px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(204, 255, 0, 0.4); cursor: pointer;}
        
        .loader { text-align: center; color: #ccff00; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <!-- BARRA VERDE -->
    <div class="top-bar">
        <span>⭐ Sport Insights</span>
        <span>✕</span>
    </div>

    <!-- PANTALLA 1: LISTA -->
    <div id="main-screen">
        <h1 style="font-size: 20px; margin-bottom: 20px;">Análisis de Partidos</h1>
        <select id="league-select">
            <optgroup label="Competiciones Europeas">
                <option value="2">UEFA Champions League</option>
                <option value="3">UEFA Europa League</option>
                <option value="848">UEFA Conference League</option>
            </optgroup>
            <optgroup label="Grandes Ligas">
                <option value="140">La Liga (España)</option>
                <option value="39">Premier League (Inglaterra)</option>
                <option value="135">Serie A (Italia)</option>
                <option value="78">Bundesliga (Alemania)</option>
                <option value="61">Ligue 1 (Francia)</option>
            </optgroup>
        </select>
        <input type="date" id="date-select">
        <button id="fetch-btn" class="btn-search">Buscar Partidos</button>
        <div id="results-list" style="margin-top: 20px;"></div>
    </div>

    <!-- PANTALLA 2: DETALLE (Diseño de tus fotos) -->
    <div id="detail-screen">
        <div class="detail-header">
            <span class="back-icon" onclick="volverAtras()">←</span>
            <div class="match-title" id="ui-title">Equipo A vs <span>Equipo B</span></div>
            
            <div class="info-row">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                <span id="ui-date">Fecha</span>
            </div>
            <div class="info-row">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <span id="ui-time">Hora</span>
            </div>
            <div class="info-row">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span id="ui-stadium">Estadio</span>
            </div>
        </div>

        <div id="detail-content">
            <!-- Aquí se carga el análisis -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
    </html>
