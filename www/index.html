<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Insights</title>
    <style>
        /* Importamos una fuente moderna de Google */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #081124; /* Azul muy oscuro de fondo */
            color: #ffffff; 
        }

        /* Barra superior imitando la de las fotos */
        .header-bar {
            background-color: #ccff00; /* Verde neón */
            color: #000;
            padding: 10px 20px;
            border-radius: 20px 20px 0 0;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            margin-bottom: -10px;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #0f1c3f; /* Azul de las tarjetas */
            padding: 20px; 
            border-radius: 0 0 20px 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        .match-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .match-title span { color: #ccff00; } /* Texto verde */

        .info-line {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #a8b2d1;
            margin-bottom: 10px;
        }

        .info-line svg { margin-right: 8px; fill: #a8b2d1; }

        /* Tarjeta de estadísticas */
        .stats-card {
            background: #14264f;
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #ccff00;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .stat-name { width: 30%; }
        .stat-bar-bg { 
            width: 60%; 
            height: 8px; 
            background: #2a3d6b; 
            border-radius: 4px; 
            margin: 0 10px;
        }
        .stat-bar-fill { 
            height: 100%; 
            background: #ccff00; 
            border-radius: 4px; 
        }
        .stat-value { width: 10%; text-align: right; }

        /* Botón de IA */
        .ai-pick {
            background: #14264f;
            border: 1px solid #ccff00;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .ai-pick h3 { margin: 0 0 10px 0; color: #ccff00; font-size: 16px; }

        /* Selector y botón de búsqueda */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #a8b2d1; }
        select { 
            width: 100%; 
            padding: 12px; 
            background: #14264f; 
            color: white;
            border: 1px solid #2a3d6b; 
            border-radius: 10px; 
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
        }
        
        button { 
            width: 100%; 
            padding: 15px; 
            background: #ccff00; 
            color: #000; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 800;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(204, 255, 0, 0.3);
        }
        button:hover { background: #b3e600; }

        #results { margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Barra superior verde -->
    <div class="header-bar" style="max-width: 600px; margin: 0 auto;">
        <span>⭐ Sport Insights</span>
        <span>✕</span>
    </div>

    <div class="container">
        <h1 class="match-title">Análisis de Partidos <br><span>Inteligencia Artificial</span></h1>
        
        <div class="form-group" style="margin-top: 20px;">
            <label for="league-select">Selecciona una liga:</label>
            <select id="league-select">
                <option value="39">Premier League (Inglaterra)</option>
                <option value="140">La Liga (España)</option>
                <option value="135">Serie A (Italia)</option>
                <option value="78">Bundesliga (Alemania)</option>
                <option value="61">Ligue 1 (Francia)</option>
            </select>
        </div>
        
        <button id="fetch-btn">Analizar Partidos</button>

        <!-- Aquí se inyectarán los resultados -->
        <div id="results">
            <!-- Ejemplo visual de cómo se verá un partido (Datos Mock) -->
            <div class="stats-card" style="margin-top:20px; border-left: none; border-top: 4px solid #ccff00;">
                <div class="match-title">Shabab Al Ahli vs <span>Esteghlal</span></div>
                
                <div class="info-line">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                    Fecha de Ejemplo
                </div>

                <div class="stats-card" style="background: #0b1736; border-left: none;">
                    <div class="stat-row">
                        <div class="stat-name">Posesión</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 65%;"></div></div>
                        <div class="stat-value">65%</div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-name">Tiros</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 40%;"></div></div>
                        <div class="stat-value">40%</div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-name">Córners</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 52%;"></div></div>
                        <div class="stat-value">52%</div>
                    </div>
                </div>

                <div class="ai-pick">
                    <h3>🤖 Pick IA:</h3>
                    <p style="margin:0; font-size: 14px;">Victoria Shabab Al Ahli (Probabilidad 62%)</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
