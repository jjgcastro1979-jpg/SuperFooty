<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperFooty Premium AI</title>
    <style>
        :root {
            --azul-fondo: #0a192f;
            --azul-tarjeta: #172a45;
            --amarillo-ia: #f6c23e;
            --blanco: #ffffff;
            --gris: #8892b0;
            --ia-verde: #10b981;
            --rojo-aviso: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--azul-fondo);
            color: var(--blanco);
            margin: 0;
            padding: 0;
            padding-bottom: 30px;
        }
        header {
            background-color: var(--azul-tarjeta);
            border-bottom: 2px solid var(--amarillo-ia);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            color: var(--amarillo-ia);
        }
        .container { padding: 15px; }
        
        /* Ficha de Partido Premium */
        .match-card {
            background-color: var(--azul-tarjeta);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(246, 194, 62, 0.15);
        }
        .match-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: var(--blanco);
            margin-bottom: 8px;
        }
        .match-meta {
            font-size: 12px;
            color: var(--gris);
            text-align: center;
            margin-bottom: 15px;
        }
        
        /* Bloque Estadísticas del Patrón */
        .section-title {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--amarillo-ia);
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
        }
        .stat-row {
            margin-bottom: 12px;
        }
        .stat-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--blanco);
        }
        .stat-bar-container {
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .stat-bar-fill {
            background-color: var(--amarillo-ia);
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .stat-bar-fill.verde { background-color: var(--ia-verde); }

        /* Cuotas y Picks */
        .odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .odd-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .odd-name { font-size: 11px; color: var(--gris); }
        .odd-val { font-size: 14px; font-weight: bold; color: var(--amarillo-ia); margin-top: 4px; }

        /* Cuadro GPT-5 */
        .ai-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed var(--ia-verde);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .ai-badge {
            background: var(--ia-verde);
            color: var(--azul-fondo);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }

        /* Línea de Tiempo del Partido */
        .timeline {
            margin-top: 10px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            padding-left: 15px;
        }
        .timeline-event {
            position: relative;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .timeline-event::before {
            content: '•';
            position: absolute;
            left: -21px;
            color: var(--amarillo-ia);
            font-size: 18px;
            top: -4px;
        }
    </style>
</head>
<body>

    <header>⚡ SuperFooty Premium AI</header>

    <div class="container" id="app-content">
        <!-- El contenido avanzado se inyecta de forma garantizada aquí -->
    </div>

    <script>
        // Datos fijos con los patrones exactos de tus imágenes (Shabab Al Ahli, Liverpool vs Chelsea, etc.)
        const partidosPremium = [
            {
                equipoL: "Shabab Al Ahli Dubai",
                equipoV: "Esteghlal",
                fecha: "27 de Octubre, 2026",
                estadio: "Al Maktoum Stadium",
                probL: "62%", probV: "38%",
                stats: [
                    { nombre: "Probabilidad Más de 2.5 goles", valor: "64%", pct: 64, c: "amarillo" },
                    { nombre: "Probabilidad Más de 1.5 goles", valor: "87%", pct: 87, c: "verde" },
                    { nombre: "Ambos marcan", valor: "58%", pct: 58, c: "amarillo" },
                    { nombre: "Promedio de córners", valor: "13.7", pct: 90, c: "verde" },
                    { nombre: "Promedio de tiros", valor: "28.83", pct: 75, c: "amarillo" }
                ],
                cuotas: [ { n: "Shabab Al Ahli", v: "1.85" }, { n: "Empate", v: "3.40" }, { n: "Esteghlal", v: "4.20" } ],
                timeline: [
                    "15' Gol Shabab Al Ahli",
                    "32' Tarjeta Amarilla",
                    "38' Tarjeta Amarilla Shabab Al Ahli",
                    "62' Gol Esteghlal",
                    "78' Cambio de Jugador"
                ],
                pickIA: "Victoria Shabab Al Ahli Dubai",
                analisisIA: "Mejor momento para el gol entre el minuto 60 y 75. Presión ofensiva alta del equipo local en transiciones."
            },
            {
                equipoL: "Liverpool",
                equipoV: "Chelsea",
                fecha: "En Vivo",
                estadio: "Anfield",
                probL: "49%", probV: "29%",
                stats: [
                    { nombre: "Posesión de Balón", valor: "53%", pct: 53, c: "verde" },
                    { nombre: "Tiros Totales", valor: "14", pct: 65, c: "amarillo" },
                    { nombre: "Córners Obtenidos", valor: "6", pct: 60, c: "verde" }
                ],
                cuotas: [ { n: "Liverpool", v: "2.10" }, { n: "Empate", v: "3.20" }, { n: "Chelsea", v: "3.10" } ],
                timeline: [
                    "22' Tarjeta Amarilla Chelsea",
                    "44' Gol de Liverpool"
                ],
                pickIA: "Más de 2.5 Goles totales",
                analisisIA: "Ataques constantes por bandas. Ambos equipos muestran desajustes en el retroceso defensivo."
            }
        ];

        function renderizarApp() {
            const root = document.getElementById('app-content');
            root.innerHTML = ''; // Asegura limpiar la pantalla

            partidosPremium.forEach(p => {
                let statsHTML = '';
                p.stats.forEach(s => {
                    statsHTML += `
                        <div class="stat-row">
                            <div class="stat-labels">
                                <span>${s.nombre}</span>
                                <strong>${s.valor}</strong>
                            </div>
                            <div class="stat-bar-container">
                                <div class="stat-bar-fill ${s.c == 'verde' ? 'verde' : ''}" style="width: ${s.pct}%"></div>
                            </div>
                        </div>
                    `;
                });

                let cuotasHTML = '';
                p.cuotas.forEach(c => {
                    cuotasHTML += `
                        <div class="odd-box">
                            <div class="odd-name">${c.n}</div>
                            <div class="odd-val">${c.v}</div>
                        </div>
                    `;
                });

                let timelineHTML = '';
                p.timeline.forEach(t => {
                    timelineHTML += `<div class="timeline-event">${t}</div>`;
                });

                const tarjeta = document.createElement('div');
                tarjeta.className = 'match-card';
                tarjeta.innerHTML = `
                    <div class="match-title">⭐ ${p.equipoL} vs ${p.equipoV}</div>
                    <div class="match-meta">📅 ${p.fecha} | 📍 ${p.estadio}</div>
                    
                    <div class="section-title">Análisis e Indicadores Clave</div>
                    ${statsHTML}

                    <div class="section-title">Mercado 1X2 Proyectado</div>
                    <div class="odds-grid">${cuotasHTML}</div>

                    <div class="ai-box">
                        <div class="ai-badge">GPT-5 AI PICK</div>
                        <div style="font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 4px;">Sugerencia: ${p.pickIA}</div>
                        <div style="font-size: 12px; color: var(--gris); line-height: 1.4;">${p.analisisIA}</div>
                    </div>

                    <div class="section-title">Cronología de Eventos</div>
                    <div class="timeline">${timelineHTML}</div>
                `;
                root.appendChild(tarjeta);
            });
        }

        // Ejecución inmediata garantizada sin bloqueos de Cordova
        window.onload = renderizarApp;
        renderizarApp();
    </script>
</body>
</html>
