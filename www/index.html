<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MisPronósticos AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- CABECERA -->
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-icon">⚙️</span>
                <h1 class="app-name">MIS PRONÓSTICOS AI</h1>
            </div>
            <p class="app-desc">Análisis deportivo en vivo</p>
        </header>

        <!-- NAVEGACIÓN DE FECHA -->
        <div class="date-nav">
            <button class="date-btn" id="prevDate">←</button>
            <div class="date-center">
                <div class="date-day" id="currentDay">Hoy</div>
                <div class="date-full" id="currentDate">Domingo 1 de nov.</div>
            </div>
            <div class="date-right">
                <button class="date-btn" id="nextDate">→</button>
                <button class="date-btn calendar-icon">📅</button>
            </div>
        </div>

        <!-- BOTONES PRINCIPALES -->
        <div class="top-buttons">
            <button class="top-btn ia" id="btnTopIA">
                <strong>⚡ Top IA</strong>
                <span>Mejores del día</span>
            </button>
            <button class="top-btn stat" id="btnStats">
                <strong>📊 Estadístico</strong>
                <span>Top Calculados</span>
            </button>
        </div>

        <!-- FILTROS -->
        <div class="filters">
            <button class="filter-tag live active" data-filter="live">🔴 En vivo</button>
            <button class="filter-tag" data-filter="player">Por jugador</button>
            <button class="filter-tag" data-filter="date">Por fecha</button>
        </div>

        <!-- TARJETA DESTACADA -->
        <div class="featured-card">
            <div class="star-icon">⭐</div>
            <div class="featured-text">
                <h3>Análisis del equipo</h3>
                <p>Lecturas del partido</p>
            </div>
        </div>

        <!-- LISTA DE PARTIDOS -->
        <div class="matches-list" id="matchesList">
            <!-- Los partidos se cargan aquí desde app.js -->
            <div class="empty-state">
                <p>Selecciona un partido para ver el análisis</p>
            </div>
        </div>

        <p class="live-prompt">Pulsa para ver el LIVE</p>
    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-nav="matches">
            <div class="nav-icon">⚽</div>
            <div>Partidos</div>
        </div>
        <div class="nav-item" data-nav="saved">
            <div class="nav-icon">⭐</div>
            <div>Guardados</div>
        </div>
        <div class="nav-item" data-nav="help">
            <div class="nav-icon">❓</div>
            <div>Ayuda</div>
        </div>
        <div class="nav-item" data-nav="plan">
            <div class="nav-icon">👑</div>
            <div>Mejorar plan</div>
        </div>
        <div class="nav-item" data-nav="settings">
            <div class="nav-icon">⚙️</div>
            <div>Opciones</div>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
