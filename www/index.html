            font-weight: bold;

            margin: 18px 0 8px 0;
            letter-spacing: 0.5px;
        }
        .stat-row { margin-bottom: 10px; }
        .stat-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .stat-bar-container {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .stat-bar-fill {
            background-color: var(--amarillo-ia);
            height: 100%;
            border-radius: 4px;
        }
        .stat-bar-fill.verde { background-color: var(--ia-verde); }
        .odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .odd-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .odd-name { font-size: 11px; color: var(--gris); table-layout: fixed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .odd-val { font-size: 13px; font-weight: bold; color: var(--amarillo-ia); margin-top: 2px; }
        .ai-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed var(--ia-verde);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .ai-badge {
            background: var(--ia-verde);
            color: var(--azul-fondo);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
    </style>
</head>
