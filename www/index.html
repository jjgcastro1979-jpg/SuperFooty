    <p style="font-size: 14px; color: var(--gray); margin-bottom: 15px;">Pulsa en un partido para ver el análisis de la IA.</p>
    
    <!-- AQUÍ ESTÁ EL NUEVO SELECTOR DE LIGAS -->
    <select id="league-select" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; background: white; font-size: 15px; font-weight: bold; color: var(--dark);">
        <option value="4328">Premier League (Inglaterra)</option>
        <option value="4335">La Liga (España)</option>
        <option value="4332">Serie A (Italia)</option>
        <option value="4331">Bundesliga (Alemania)</option>
        <option value="4334">Ligue 1 (Francia)</option>
        <option value="4480">UEFA Champions League</option>

    <div id="lista-partidos">

    </div>
    
    <br>
    <button class="btn" onclick="cargarPartidos()">🔄 Generar Nuevos Partidos</button>
</main>
