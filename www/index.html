<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperFooty</title>
    <style>
        :root {
            --azul-fondo: #0a192f;
            --azul-tarjeta: #172a45;
            --amarillo-ia: #f6c23e;
            --blanco: #ffffff;
            --gris: #8892b0;
            --ia-verde: #10b981;
            --rojo-aviso: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--azul-fondo); color: var(--blanco); min-height: 100vh; padding-bottom: 70px; }
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }
        .app-header { text-align: center; margin-bottom: 25px; }
        .logo-icon { font-size: 28px; }
        .app-name { font-size: 22px; color: var(--amarillo-ia); margin: 5px 0; }
        .date-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .date-btn { background: var(--azul-tarjeta); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .top-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        .top-btn.ia { background: var(--amarillo-ia); color: #000; font-weight: bold; }
        .top-btn.stat { background: var(--azul-tarjeta); color: white; }
        .filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; }
        .filter-tag { padding: 8px 14px; border-radius: 20px; border: none; white-space: nowrap; cursor: pointer; }
        .filter-tag.live { background: var(--ia-verde); color: white; }
        .filter-tag:not(.live) { background: var(--azul-tarjeta); color: var(--gris); }
        .featured-card { background: var(--azul-tarjeta); border-radius: 12px; padding: 20px; margin-bottom: 25px; text-align: center; }
        .star-icon { font-size: 24px; margin-bottom: 8px; }
        .selection-area { text-align: center; margin-bottom: 25px; }
        .select-text, .live-text { color: var(--gris); font-size: 14px; margin-bottom: 8px; }
        .controls-area { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .form-select, .form-control { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--azul-tarjeta); color: white; font-size: 15px; }
        .load-btn { background: var(--amarillo-ia); color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .matches-list { display: flex; flex-direction: column; gap: 10px; }
        .match-card { background: var(--azul-tarjeta); border-radius: 10px; padding: 15px; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--azul-tarjeta); display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--gris); cursor: pointer; }
        .nav-item.active { color: var(--amarillo-ia); }
        .nav-icon { font-size: 20px; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <span class="logo-icon">⚙️</span>
            <h1 class="app-name">MIS PRONÓSTICOS AI</h1>
            <p style="color: var(--gris); font-size: 14px;">Análisis deportivo en vivo</p>
        </header>

        <div class="date-nav">
            <button class="date-btn" id="prevDate">←</button>
            <div>
                <div style="font-weight:bold;" id="currentDay">Hoy</div>
                <div style="font-size:12px; color:var(--gris)" id="currentDate"></div>
            </div>
            <button class="date-btn" id="nextDate">→</button>
        </div>

        <div class="top-buttons">
            <button class="top-btn ia" id="btnTopIA">⚡ Top IA<br><span style="font-size:11px">Mejores del día</span></button>
            <button class="top-btn stat" id="btnStats">📊 Estadístico<br><span style="font-size:11px">Top Calculados</span></button>
        </div>

        <div class="filters">
            <button class="filter-tag live">🔴 En vivo</button>
            <button class="filter-tag">Por jugador</button>
            <button class="filter-tag">Por fecha</button>
        </div>

        <div class="featured-card">
            <span class="star-icon">⭐</span>
            <h3>Análisis del equipo</h3>
            <p style="color: var(--gris); font-size: 14px; margin-top: 5px;">Lecturas del partido</p>
        </div>

        <div class="selection-area">
            <p class="select-text">Selecciona un partido para ver el análisis</p>
            <p class="live-text">Pulsa para ver el LIVE</p>
            <div class="controls-area">
                <select id="league-select" class="form-select">
                    <option value="">Selecciona una liga</option>
                    <option value="eng.1">Premier League</option>
                    <option value="esp.1">La Liga</option>
                    <option value="ita.1">Serie A</option>
                    <option value="ger.1">Bundesliga</option>
                    <option value="fra.1">Ligue 1</option>
                    <option value="uefa.champions">Champions League</option>
                </select>
                <input type="date" id="date-select" class="form-control">
                <button onclick="cargarPartidos()" class="load-btn">🔍 Buscar Partidos</button>
            </div>
        </div>

        <div id="lista-partidos" class="matches-list"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">⚽</div>
            <div>Partidos</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">⭐</div>
            <div>Guardados</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">❓</div>
            <div>Ayuda</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👑</div>
            <div>Mejorar plan</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">⚙️</div>
            <div>Opciones</div>
        </div>
    </nav>

    <script>
        // Fecha de hoy automática
        document.addEventListener('DOMContentLoaded', function() {
            const hoy = new Date();
            const fechaInput = document.getElementById('date-select');
            if (fechaInput) fechaInput.valueAsDate = hoy;
            
            const opciones = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('currentDate').textContent = hoy.toLocaleDateString('es-ES', opciones);
        });

        function cargarPartidos() {
            const liga = document.getElementById('league-select').value;
            const fecha = document.getElementById('date-select').value;
            const lista = document.getElementById('lista-partidos');
            
            if (!fecha) {
                alert("Selecciona una fecha");
                return;
            }
            
            lista.innerHTML = '<div style="text-align:center; padding:30px;">⚽ Cargando partidos... ⏳</div>';
            
            // Simulación de partidos mientras se conecta la API
            setTimeout(() => {
                if (!liga) {
                    lista.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:40px 20px;">Selecciona una liga para ver los partidos</p>';
                    return;
                }
                
                lista.innerHTML = `
                    <div class="match-card" onclick="alert('Análisis disponible pronto')">
                        <div style="padding:10px 0;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <span style="font-size:12px; color:#94a3b8;">${liga.toUpperCase()}</span>
                                <span style="font-size:13px;">⏰ 21:00</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:bold;">Equipo Local</span>
                                <span style="color:#94a3b8; font-size:12px;">vs</span>
                                <span style="font-weight:bold;">Equipo Visita</span>
                            </div>
                        </div>
                    </div>
                    <div style="text-align:center; margin-top:20px; color:#10b981; font-size:13px;">✅ Botón funcionando</div>
                `;
            }, 800);
        }
    </script>
</body>
</html>
