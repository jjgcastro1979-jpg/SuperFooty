<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pronósticos AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- CABECERA -->
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-icon">⚙️</span>
                <h1 class="app-name">MIS PRONÓSTICOS AI</h1>
            </div>
            <p class="app-desc">Análisis deportivo en vivo</p>
        </header>

        <!-- FECHA -->
        <div class="date-nav">
            <button class="date-btn" id="prevDate">←</button>
            <div class="date-center">
                <div class="date-day" id="currentDay">Hoy</div>
                <div class="date-full" id="currentDate">Domingo 1 de nov.</div>
            </div>
            <button class="date-btn calendar-btn" id="calendarBtn">📅</button>
            <button class="date-btn" id="nextDate">→</button>
        </div>

        <!-- BOTONES PRINCIPALES -->
        <div class="top-buttons">
            <button class="top-btn ia active" id="btnTopIA">
                <span class="bolt">⚡</span> Top IA
                <span class="sub">Mejores del día</span>
            </button>
            <button class="top-btn stat" id="btnStats">
                <span class="chart">📊</span> Estadístico
                <span class="sub">Top Calculados</span>
            </button>
        </div>

        <!-- FILTROS -->
        <div class="filters">
            <button class="filter-tag live active" data-filter="live">🔴 En vivo</button>
            <button class="filter-tag" data-filter="player">Por jugador</button>
            <button class="filter-tag" data-filter="date">Por fecha</button>
        </div>

        <!-- TARJETA DESTACADA -->
        <div class="featured-card">
            <div class="star-icon">⭐</div>
            <div class="featured-text">
                <h3>Análisis del equipo</h3>
                <p>Lecturas del partido</p>
            </div>
        </div>

        <!-- SELECCIÓN DE PARTIDOS -->
        <div class="selection-area">
            <p class="select-text">Selecciona un partido para ver el análisis</p>
            <p class="live-text">Pulsa para ver el LIVE</p>
            
            <div class="controls-area">
                <select id="league-select" class="form-select">
                    <option value="">Selecciona una liga</option>
                    <option value="eng.1">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</option>
                    <option value="esp.1">🇪🇸 La Liga</option>
                    <option value="ita.1">🇮🇹 Serie A</option>
                    <option value="ger.1">🇩🇪 Bundesliga</option>
                    <option value="fra.1">🇫🇷 Ligue 1</option>
                    <option value="uefa.champions">🏆 Champions League</option>
                </select>
                <input type="date" id="date-select" class="form-control">
                <button onclick="cargarPartidos()" class="load-btn">🔍 Buscar Partidos</button>
            </div>
        </div>

        <!-- LISTA DE PARTIDOS -->
        <div id="lista-partidos" class="matches-list"></div>
    </div>

    <!-- BARRA INFERIOR -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-nav="matches">
            <div class="nav-icon">⚽</div>
            <div>Partidos</div>
        </div>
        <div class="nav-item" data-nav="saved">
            <div class="nav-icon">⭐</div>
            <div>Guardados</div>
        </div>
        <div class="nav-item" data-nav="help">
            <div class="nav-icon">❓</div>
            <div>Ayuda</div>
        </div>
        <div class="nav-item" data-nav="plan">
            <div class="nav-icon">👑</div>
            <div>Mejorar plan</div>
        </div>
        <div class="nav-item" data-nav="settings">
            <div class="nav-icon">⚙️</div>
            <div>Opciones</div>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
